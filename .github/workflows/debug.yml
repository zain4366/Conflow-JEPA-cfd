# Single-segment runs for checking a case quickly (own concurrency group, so it does not wait for a
# long su2 run). Trigger: edit requests/debug.json on main: {"cases": [...]}. Results are published
# to the results branch exactly like su2 runs (runs/<run_id>/<case> and latest/<case>).
name: su2-quick
on:
  push:
    branches: [main]
    paths: ["requests/debug.json"]
permissions:
  contents: write
concurrency:
  group: su2-quick
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.p.outputs.cases }}
      reference: ${{ steps.p.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 -c "import json;d=json.load(open('requests/debug.json'));print('cases='+json.dumps(d['cases']));print('reference='+('true' if d.get('reference') is True else 'false'))" | tee -a "$GITHUB_OUTPUT"
  reference:
    needs: plan
    if: needs.plan.outputs.reference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy scipy pyyaml requests
      - run: python3 runner/fetch_reference.py out/reference
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash runner/publish.sh out/reference reference ${{ github.run_id }}
  run:
    needs: plan
    if: needs.plan.outputs.cases != '[]'
    strategy:
      fail-fast: false
      matrix: {case: "${{ fromJSON(needs.plan.outputs.cases) }}"}
    uses: ./.github/workflows/segment.yml
    with: {case: "${{ matrix.case }}", segment: 1, last: true}
